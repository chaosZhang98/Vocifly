<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Vocifly">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f1e2"/><stop offset="1" stop-color="#e6f1ec"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ecfb"/><stop offset="1" stop-color="#c2e2f6"/>
    </linearGradient>
  </defs>

  <!-- 圆角方底（暖奶油 → 淡青） -->
  <rect x="18" y="18" width="476" height="476" rx="132" fill="url(#bg)"/>

  <!-- 底部软云（梦幻、无描边） -->
  <g fill="#fbfdff">
    <circle cx="150" cy="438" r="46"/><circle cx="216" cy="446" r="36"/><circle cx="96" cy="446" r="28"/>
  </g>

  <!-- 围巾 / 飘带（陶土红，从手机左下方拖出） -->
  <g fill="#e07a5f">
    <path d="M176 392 C 132 384 96 408 56 384 C 44 376 40 356 54 348 C 94 372 132 352 178 364 Z"/>
    <path d="M56 384 C 38 398 20 394 10 404 C 30 412 52 410 66 398 Z"/>
    <path d="M108 396 C 84 414 62 410 48 424 C 68 432 96 428 116 412 C 122 406 118 398 108 396 Z"/>
  </g>

  <!-- 声波（草绿，拖尾在左侧） -->
  <path d="M120 236 a30 32 0 0 0 0 88" stroke="#4a9456" stroke-width="17" stroke-linecap="round"/>
  <path d="M86 204 a66 70 0 0 0 0 152" stroke="#4a9456" stroke-width="17" stroke-linecap="round" opacity=".8"/>

  <!-- 手机（主体，倾斜飞行） -->
  <g transform="rotate(-13 256 262)">
    <rect x="140" y="112" width="232" height="292" rx="46" fill="#fffdf8" stroke="#3a4059" stroke-width="16"/>
    <!-- 听筒 -->
    <line x1="218" y1="146" x2="294" y2="146" stroke="#3a4059" stroke-width="10" stroke-linecap="round" opacity=".5"/>
    <!-- 屏幕 -->
    <rect x="166" y="174" width="180" height="168" rx="20" fill="url(#screen)" stroke="#3a4059" stroke-width="9"/>
    <!-- 屏幕内麦克风 -->
    <g>
      <rect x="226" y="206" width="60" height="70" rx="30" fill="#5b9fd4" stroke="#3a4059" stroke-width="9"/>
      <line x1="238" y1="228" x2="274" y2="228" stroke="#3a4059" stroke-width="6" stroke-linecap="round" opacity=".4"/>
      <line x1="238" y1="246" x2="274" y2="246" stroke="#3a4059" stroke-width="6" stroke-linecap="round" opacity=".4"/>
      <path d="M256 278 v12" stroke="#3a4059" stroke-width="9" stroke-linecap="round"/>
      <path d="M230 302 q26 16 52 0" stroke="#3a4059" stroke-width="9" stroke-linecap="round" fill="none"/>
    </g>
    <!-- 屏幕内声波 -->
    <path d="M198 240 a20 20 0 0 0 0 36" stroke="#4a9456" stroke-width="10" stroke-linecap="round"/>
    <path d="M314 240 a20 20 0 0 1 0 36" stroke="#4a9456" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- 金色四点星 -->
  <path d="M406 132 l9 20 21 5 -18 13 6 21 -18 -12 -18 12 6 -21 -18 -13 21 -5 z" fill="#e0a72f"/>
</svg>
