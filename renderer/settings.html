<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PhVoice 设置</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: -apple-system, "PingFang SC", sans-serif; background: #f6f7f9; color: #202124; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px 10px; }
    .topbar h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .topbar a { color: #2563eb; text-decoration: none; font-size: 14px; }
    main { max-width: 660px; margin: 8px auto 40px; padding: 0 20px; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 22px 24px; }
    .section-title { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
    .section-desc { margin: 0 0 16px; color: #666; font-size: 13px; }
    .provider-list { display: grid; gap: 10px; }
    label.option { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; border: 1px solid #e5e7eb; border-radius: 8px; padding: 13px 14px; cursor: pointer; }
    label.option input { margin-top: 3px; }
    label.option strong { display: block; font-size: 15px; }
    label.option p { margin: 3px 0 0; color: #666; font-size: 13px; line-height: 1.5; }
    label.option.disabled { opacity: .5; cursor: not-allowed; }
    .fields { display: grid; gap: 14px; margin-top: 18px; }
    .field { display: grid; gap: 5px; }
    .field label { font-size: 13px; color: #444; }
    .field input { width: 100%; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; font-family: inherit; }
    .field input:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
    .field .hint { color: #888; font-size: 12px; }
    .advanced { margin-top: 16px; padding-top: 14px; border-top: 1px solid #eee; display: grid; gap: 14px; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee; }
    #status { color: #666; font-size: 13px; line-height: 1.5; }
    #status.success { color: #137333; }
    #status.error { color: #c5221f; }
    button { border: 0; border-radius: 6px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; background: #2563eb; color: #fff; }
    button:disabled { opacity: .55; cursor: default; }
    .ghost-btn { background: #fff; color: #2563eb; border: 1px solid #2563eb; }
    .rule-list { display: grid; gap: 10px; margin-bottom: 12px; }
    .rule-row { display: grid; grid-template-columns: 1fr 130px 130px 40px; gap: 8px; align-items: center; }
    .rule-row input, .rule-row select { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; font-family: inherit; background: #fff; }
    .rule-row input:focus, .rule-row select:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
    .remove-rule { width: 40px; height: 40px; border-radius: 8px; border: 1px solid #e5e7eb; background: #f8f9fa; color: #666; font-size: 18px; cursor: pointer; }
    #ruleStatus { color: #666; font-size: 13px; line-height: 1.5; }
    #ruleStatus.success { color: #137333; }
    #ruleStatus.error { color: #c5221f; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>PhVoice 设置</h1>
    <a href="/mac">← 返回主页</a>
  </header>

  <main>
    <section class="panel">
      <h2 class="section-title">识别服务（ASR）</h2>
      <p class="section-desc">切换后立即生效，正在进行的识别仍使用旧配置。</p>

      <div class="provider-list" id="providerList">
        <label class="option">
          <input type="radio" name="provider" value="sherpa"/>
          <span>
            <strong>离线 ASR（本地 sherpa-onnx）</strong>
            <p>免费、完全离线、隐私最好；适合日常短句，长难句精度一般。</p>
          </span>
        </label>
        <label class="option">
          <input type="radio" name="provider" value="bailian"/>
          <span>
            <strong>阿里云百炼实时语音识别（推荐）</strong>
            <p>在百炼控制台获取 sk- 开头的 API Key 即可使用，精度高，按量计费。</p>
          </span>
        </label>
        <label class="option disabled">
          <input type="radio" name="provider" value="tencent" disabled/>
          <span>
            <strong>腾讯云 / 火山引擎</strong>
            <p>预留入口，后续版本接入。</p>
          </span>
        </label>
      </div>

      <div class="fields hidden" id="bailianFields">
        <div class="field">
          <label for="bailianApiKey">百炼 API Key</label>
          <input id="bailianApiKey" type="password" autocomplete="off" placeholder="sk-..."/>
          <span class="hint">阿里云百炼控制台“API Key 管理”中创建。</span>
        </div>
        <div class="field">
          <label for="bailianPrice">单价（元/秒）</label>
          <input id="bailianPrice" type="number" step="0.0001" min="0" placeholder="0.00033"/>
          <span class="hint">qwen-audio-3.0-asr-flash-streaming 按音频时长计费，北京地域约 0.00033 元/秒；使用工作区网关时请按实际价格填写。</span>
        </div>
      </div>

      <div class="actions">
        <span id="status">正在读取当前配置…</span>
        <button id="saveBtn" type="button">保存设置</button>
      </div>
    </section>

    <section class="panel" style="margin-top: 18px;">
      <h2 class="section-title">发送快捷键</h2>
      <p class="section-desc">按前台 App 自动选择回车方式与删除方式。</p>
      <div id="ruleList" class="rule-list"></div>
      <button id="addRuleBtn" class="ghost-btn" type="button">+ 添加规则</button>
      <div class="actions">
        <span id="ruleStatus">未保存</span>
        <button id="saveRulesBtn" type="button">保存规则</button>
      </div>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById('status')
    const saveBtn = document.getElementById('saveBtn')
    const bailianFields = document.getElementById('bailianFields')
    const bailian = {
      apiKey: document.getElementById('bailianApiKey'),
      price: document.getElementById('bailianPrice'),
    }
    const providers = Array.from(document.querySelectorAll('input[name="provider"]'))
    const ruleList = document.getElementById('ruleList')
    const addRuleBtn = document.getElementById('addRuleBtn')
    const saveRulesBtn = document.getElementById('saveRulesBtn')
    const ruleStatus = document.getElementById('ruleStatus')
    const KEY_OPTIONS = [
      ['enter', '普通回车'],
      ['ctrl-enter', 'Ctrl+回车'],
      ['cmd-enter', 'Cmd+回车'],
      ['none', '不发送'],
    ]
    const DELETE_OPTIONS = [
      ['undo', '撤销（推荐）'],
      ['backspace', '退格'],
      ['none', '不删除'],
    ]

    function setStatus(text, type) {
      statusEl.textContent = text
      statusEl.className = type || ''
    }

    function setRuleStatus(text, type) {
      ruleStatus.textContent = text
      ruleStatus.className = type || ''
    }

    function addRuleRow(appName, sendKey, deleteKey) {
      const row = document.createElement('div')
      row.className = 'rule-row'
      const input = document.createElement('input')
      input.type = 'text'
      input.placeholder = 'App 名称或 Bundle ID'
      input.value = appName || ''
      const sendSelect = document.createElement('select')
      for (const [value, label] of KEY_OPTIONS) {
        const option = document.createElement('option')
        option.value = value
        option.textContent = label
        if (value === (sendKey || 'enter')) option.selected = true
        sendSelect.appendChild(option)
      }
      const deleteSelect = document.createElement('select')
      for (const [value, label] of DELETE_OPTIONS) {
        const option = document.createElement('option')
        option.value = value
        option.textContent = label
        if (value === (deleteKey || 'undo')) option.selected = true
        deleteSelect.appendChild(option)
      }
      const remove = document.createElement('button')
      remove.type = 'button'
      remove.className = 'remove-rule'
      remove.textContent = '×'
      remove.setAttribute('aria-label', '删除规则')
      remove.addEventListener('click', () => row.remove())
      row.append(input, sendSelect, deleteSelect, remove)
      ruleList.appendChild(row)
    }

    function renderRules(sendRules, deleteRules) {
      ruleList.innerHTML = ''
      const entries = Object.entries(sendRules || {})
      if (entries.length === 0) {
        addRuleRow('', 'enter', 'undo')
        return
      }
      for (const [name, key] of entries) addRuleRow(name, key, (deleteRules || {})[name] || 'undo')
    }

    function setDisabled(group, disabled) {
      Object.values(group).forEach((el) => { el.disabled = disabled })
    }

    function toggleFields() {
      const value = providers.find((r) => r.checked)?.value
      const showBailian = value === 'bailian'
      bailianFields.classList.toggle('hidden', !showBailian)
      setDisabled(bailian, !showBailian)
    }

    providers.forEach((radio) => radio.addEventListener('change', toggleFields))

    async function load() {
      try {
        const res = await fetch('/api/settings', { cache: 'no-store' })
        if (!res.ok) throw new Error('HTTP ' + res.status)
        const settings = await res.json()
        const provider = settings.asr.provider
        if (providers.find((r) => r.value === provider)) {
          providers.find((r) => r.value === provider).click()
        } else {
          providers.find((r) => r.value === 'sherpa').click()
        }
        bailian.apiKey.value = settings.asr.bailian.apiKey || ''
        bailian.price.value = settings.asr.bailian.pricePerSecond != null ? settings.asr.bailian.pricePerSecond : ''
        renderRules(settings.sendRules || {}, settings.deleteRules || {})
        setStatus('')
      } catch (error) {
        setStatus('读取配置失败：' + error.message, 'error')
      }
    }

    saveBtn.addEventListener('click', async () => {
      const provider = providers.find((r) => r.checked)?.value
      saveBtn.disabled = true
      setStatus('保存中…')
      try {
        const body = { asr: { provider } }
        if (provider === 'bailian') {
          body.asr.bailian = {
            apiKey: bailian.apiKey.value.trim(),
            pricePerSecond: Number(bailian.price.value) || 0.00033,
          }
        }
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        })
        const result = await res.json()
        if (!res.ok || !result.ok) throw new Error(result.error || 'HTTP ' + res.status)
        setStatus('已保存，下一次识别使用新配置。', 'success')
      } catch (error) {
        setStatus('保存失败：' + error.message, 'error')
      } finally {
        saveBtn.disabled = false
      }
    })

    addRuleBtn.addEventListener('click', () => addRuleRow())

    saveRulesBtn.addEventListener('click', async () => {
      const sendRules = {}
      const deleteRules = {}
      for (const row of ruleList.querySelectorAll('.rule-row')) {
        const name = row.querySelector('input').value.trim()
        if (!name) continue
        const selects = row.querySelectorAll('select')
        sendRules[name] = selects[0].value
        deleteRules[name] = selects[1].value
      }
      saveRulesBtn.disabled = true
      setRuleStatus('保存中…')
      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sendRules, deleteRules }),
        })
        const result = await res.json()
        if (!res.ok || !result.ok) throw new Error(result.error || 'HTTP ' + res.status)
        setRuleStatus('已保存，发送时立即生效。', 'success')
      } catch (error) {
        setRuleStatus('保存失败：' + error.message, 'error')
      } finally {
        saveRulesBtn.disabled = false
      }
    })

    load()
  </script>
</body>
</html>
